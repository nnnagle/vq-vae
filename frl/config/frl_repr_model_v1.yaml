version: "4"
name: frl_repr_model_v1

# ================================================================
# Latent dimensions
# ================================================================
# z_type_dim ties together: type_encoder output, spatial_conv channels,
# and FiLM cond_dim. Changing it requires consistent adjustment of
# type_encoder.channels[-1].
#
# z_phase_dim ties together: phase_head output and FiLM target_dim.
# ================================================================
latents:
  z_type_dim: 48
  z_phase_dim: 8

# ================================================================
# Type pathway
# ================================================================
type_encoder:
  # channels[-1] must equal latents.z_type_dim
  channels: [128, 48]
  kernel_size: 1
  padding: 0
  dropout: [0.0, 0.0]
  num_groups: 8

  # input_dropout: zeros entire input channel maps before the first conv.
  # Forces the encoder to learn cross-band structure rather than per-band features.
  #
  # Option A — constant rate (scalar):
  #   input_dropout: 0.05
  #
  # Option B — scheduled rate (dict):
  #   input_dropout:
  #     schedule: linear    # or: cosine
  #     start: 0.0          # rate at epoch 0
  #     end: 0.1            # rate after ramp completes
  #     epochs: 20          # ramp length; holds at `end` thereafter
  #
  input_dropout:
    schedule: linear
    start: 0.0    # no dropout at epoch 0 — let the model warm up first
    end: 0.10     # ramp to 10 % over the first 20 epochs, then hold
    epochs: 20

spatial_conv:
  # channels are inferred from latents.z_type_dim
  num_layers: 2           # retained for signature compat; unused in EdgeAwareSmoothingConv2D
  kernel_size: 3
  padding: 1
  gate_hidden: 64
  gate_kernel_size: 3
  num_directions: 4       # orientations in filter bank; total K = num_directions × 2 scales
  coarse_dilation: 3      # dilation for coarse-scale bank filters (7×7 effective)
  rank: 4                 # R shared direction-basis patterns; channels correlated but not tied

# ================================================================
# Type projection head (SimCLR-style)
# ================================================================
# Applied between z_type and InfoNCE losses during training.
# Discarded at inference — z_type is used directly downstream.
# VICReg operates on raw z_type (not projected) to guard backbone.
type_projection:
  enabled: false      # head-free: project_type() is identity; spectral InfoNCE
                      # runs on raw z_type (see infonce_type_spectral.temperature)
  hidden_dim: 48      # matches z_type_dim; single bottleneck layer
  output_dim: 8       # small: spectral data has ~3-4 significant PCs
  l2_normalize: true

# ================================================================
# Phase pathway
# ================================================================
phase_tcn:
  channels: [64, 64, 64]
  kernel_size: 3
  dilations: [1, 2, 4]
  dropout: 0.1
  num_groups: 8
  # Magnitude-preserving norm for the FiLM-free phase pathway (Step 3b): 'none'
  # (input already O(1)-scaled) or 'batch' (running stats). NOT 'group' — a
  # per-sample GroupNorm-over-T divides out the depth→radius signal.
  norm: none

# Step-1 mature-baseline RFF readout μ(z_type), σ(z_type) → the anomaly input.
# Buffer-only online estimator (no gradient params). See models/mature_baseline.py.
mature_baseline:
  n_features: 1024      # RFF dim D; larger → sharper revert-to-prior / leverage
  bandwidth: 1.0        # RFF length-scale h (standardized z_type units); tune by val-NLL
  ridge_lambda: 1.0e-3
  sigma_floor: 1.0e-2
  ema_decay: 0.99

# Step-2 anomaly input transform a=(x-μ)/σ + Δa. See models/anomaly_transform.py.
anomaly_transform:
  delta_only: true      # [a ; Δa]; Δ² deferred
  scale_decay: 0.99     # EMA decay for the Δ robust scale observed during warmup

# Step-4 within-pixel Gaussian OU dynamics. See losses/ou_dynamics.py.
ou_dynamics:
  rho_init: 0.9         # contraction ρ∈(0,1), scalar global
  learn_rho: true       # ρ is a learned sigmoid-constrained scalar
  s0: 0.5               # base noise scale (basin scale)
  s1: 0.0               # radius-growth coeff (0 = homoscedastic; enable for tighter basin)
  learn_s: false        # default: fixed s → weighted squared residual (no log-s collapse magnet)
  tau: 2.0              # disturbance-gate scale on ‖Δa‖ (locked Δ-scale units)
